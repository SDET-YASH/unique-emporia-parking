<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unique EMPORIA - Parking Management</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="container">
      <h1 id="society-name">Unique EMPORIA</h1>
      <p id="tower-name">Tower B</p>
    </div>
  </header>

  <main class="container">
    <div class="top-bar">
      <div class="controls">
        <input type="search" id="search" placeholder="Search by flat, name, slot, phone...">
        <select id="filter-status">
          <option value="">All Status</option>
          <option value="Allocated">Allocated</option>
          <option value="Pending">Pending</option>
        </select>
        <select id="filter-bay">
          <option value="">All Bay Types</option>
          <option value="Open">Open</option>
          <option value="Stilt">Stilt</option>
          <option value="Underground">Underground</option>
          <option value="Unassigned">Unassigned</option>
        </select>
      </div>
      <a href="admin.html" class="btn btn-secondary">Admin</a>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="label">Total Records</div>
        <div class="value" id="stat-total">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Allocated</div>
        <div class="value" id="stat-allocated">0</div>
      </div>
      <div class="stat-card">
        <div class="label">Pending</div>
        <div class="value" id="stat-pending">0</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tower</th>
            <th>Flat No.</th>
            <th>Resident Name</th>
            <th>Type</th>
            <th>Contact</th>
            <th>Vehicle</th>
            <th>Bay Type</th>
            <th>Slot No.</th>
            <th>Status</th>
            <th>Remarks</th>
          </tr>
        </thead>
        <tbody id="records-body">
          <tr><td colspan="11" class="empty-state">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <footer>
    Unique EMPORIA
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
